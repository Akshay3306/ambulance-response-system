apiVersion: v1
kind: ConfigMap
metadata:
  name: rapid-response-config
data:
  PORT: "3000"
  MONGODB_URI: "mongodb://mongo:27017/rapid_response_ems"
  COOKIE_SECURE: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rapid-response
  labels:
    app: rapid-response
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rapid-response
  template:
    metadata:
      labels:
        app: rapid-response
    spec:
      containers:
        - name: app
          image: rapid-response-ems:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: rapid-response-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rapid-response-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rapid-response
spec:
  type: NodePort
  selector:
    app: rapid-response
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
